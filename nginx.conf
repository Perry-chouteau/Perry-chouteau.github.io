server {
  # Image nginx-unprivileged : port non-privilegie, tourne en non-root.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Toute redirection reste relative. Derriere un ingress, nginx ne connait
  # pas le host public : en absolu il renverrait vers le nom du pod.
  absolute_redirect off;

  # Astro build en format 'file' : /fr/jobs/electricite -> electricite.html.
  # Le $uri.html sert la page directement, sans 301 pour ajouter un slash.
  #
  # Le no-cache est pose ici et pas sur un `location ~* \.html$` : les URLs
  # n'ont plus d'extension, ce location ne matcherait jamais. Le HTML doit
  # etre revalide, sinon un redeploiement passe inapercu.
  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  # Les assets ont un hash dans leur nom : immutables.
  # Prefixe plus specifique que `location /`, donc il gagne.
  # Un seul add_header : `expires` emettrait un seconde Cache-Control et
  # certains proxies ne gardent que le premier.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # Cible des probes Kubernetes.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
