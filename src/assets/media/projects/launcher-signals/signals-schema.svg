<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="1760" height="1040" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
  <rect width="880" height="520" fill="#13151a"/>
  <text x="48" y="70" fill="#7c8bff" font-size="38" font-weight="700">launcher · signals</text>
  <text x="48" y="98" fill="#6b7180" font-size="14" font-family="ui-monospace, monospace">two processes talk on one Linux box — only Unix signals, no socket, no file</text>

  <!-- process A -->
  <rect x="48" y="150" width="300" height="150" rx="14" fill="#1c1f27" stroke="#2b2f3a"/>
  <text x="72" y="182" fill="#eceef2" font-size="16" font-weight="600" font-family="ui-monospace, monospace">Sender (pid A)</text>
  <text x="72" y="212" fill="#9aa0ab" font-size="13" font-family="ui-monospace, monospace">encodes each byte, bit by bit</text>
  <text x="72" y="244" fill="#c7ccd6" font-size="13.5" font-family="ui-monospace, monospace">bit 0 → kill(B, SIGUSR1)</text>
  <text x="72" y="268" fill="#c7ccd6" font-size="13.5" font-family="ui-monospace, monospace">bit 1 → kill(B, SIGUSR2)</text>

  <!-- process B -->
  <rect x="532" y="150" width="300" height="150" rx="14" fill="#1c1f27" stroke="#2b2f3a"/>
  <text x="556" y="182" fill="#eceef2" font-size="16" font-weight="600" font-family="ui-monospace, monospace">Receiver (pid B)</text>
  <text x="556" y="212" fill="#9aa0ab" font-size="13" font-family="ui-monospace, monospace">signal handler per bit</text>
  <text x="556" y="244" fill="#c7ccd6" font-size="13.5" font-family="ui-monospace, monospace">sigaction(SIGUSR1/2)</text>
  <text x="556" y="268" fill="#c7ccd6" font-size="13.5" font-family="ui-monospace, monospace">rebuilds the byte, acks back</text>

  <!-- signal arrows -->
  <path d="M 348 205 L 528 205" stroke="#4ec9a5" stroke-width="2"/><polygon points="536,205 526,200 526,210" fill="#4ec9a5"/>
  <text x="440" y="197" fill="#4ec9a5" font-size="12.5" font-family="ui-monospace, monospace" text-anchor="middle">SIGUSR1 / SIGUSR2</text>
  <path d="M 528 258 L 352 258" stroke="#4b5160" stroke-width="1.6" stroke-dasharray="5 5"/><polygon points="344,258 354,253 354,263" fill="#4b5160"/>
  <text x="440" y="278" fill="#6b7180" font-size="11.5" font-family="ui-monospace, monospace" text-anchor="middle">ack (SIGUSR1)</text>

  <!-- bitstream -->
  <text x="72" y="356" fill="#e0a458" font-size="13" font-family="ui-monospace, monospace">'H'  =  0 1 0 0 1 0 0 0</text>
  <g font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">
    <rect x="72"  y="372" width="34" height="30" rx="6" fill="#20242e" stroke="#2b2f3a"/><text x="89"  y="392" fill="#9aa0ab">0</text>
    <rect x="112" y="372" width="34" height="30" rx="6" fill="#20242e" stroke="#2b2f3a"/><text x="129" y="392" fill="#7c8bff">1</text>
    <rect x="152" y="372" width="34" height="30" rx="6" fill="#20242e" stroke="#2b2f3a"/><text x="169" y="392" fill="#9aa0ab">0</text>
    <rect x="192" y="372" width="34" height="30" rx="6" fill="#20242e" stroke="#2b2f3a"/><text x="209" y="392" fill="#9aa0ab">0</text>
    <rect x="232" y="372" width="34" height="30" rx="6" fill="#20242e" stroke="#2b2f3a"/><text x="249" y="392" fill="#7c8bff">1</text>
    <rect x="272" y="372" width="34" height="30" rx="6" fill="#20242e" stroke="#2b2f3a"/><text x="289" y="392" fill="#9aa0ab">0</text>
    <rect x="312" y="372" width="34" height="30" rx="6" fill="#20242e" stroke="#2b2f3a"/><text x="329" y="392" fill="#9aa0ab">0</text>
    <rect x="352" y="372" width="34" height="30" rx="6" fill="#20242e" stroke="#2b2f3a"/><text x="369" y="392" fill="#9aa0ab">0</text>
  </g>
  <text x="72" y="440" fill="#6b7180" font-size="12.5" font-family="ui-monospace, monospace">Two signals = two symbols → a full byte channel between unrelated processes.</text>
</svg>
