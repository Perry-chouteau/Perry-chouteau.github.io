<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="1760" height="1120" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
  <rect width="880" height="560" fill="#13151a"/>

  <!-- header -->
  <text x="48" y="70" fill="#7c8bff" font-size="44" font-weight="700">i18n</text>
  <text x="178" y="70" fill="#9aa0ab" font-size="18" font-family="ui-monospace, monospace">type-safe locales</text>
  <text x="48" y="98" fill="#6b7180" font-size="14" font-family="ui-monospace, monospace">header-only C++11 / C++20 · concepts · zero dependency</text>

  <!-- ===== left: inheritance ===== -->
  <!-- ILocale -->
  <rect x="56" y="132" width="300" height="66" rx="12" fill="#1c1f27" stroke="#2b2f3a"/>
  <text x="76" y="162" fill="#7c8bff" font-size="16" font-weight="600" font-family="ui-monospace, monospace">ILocale</text>
  <text x="168" y="162" fill="#6b7180" font-size="12" font-family="ui-monospace, monospace">«interface»</text>
  <text x="76" y="184" fill="#9aa0ab" font-size="12.5" font-family="ui-monospace, monospace">languageCode() const = 0</text>

  <!-- DefaultLocale -->
  <rect x="56" y="240" width="300" height="74" rx="12" fill="#1c1f27" stroke="#2b2f3a"/>
  <text x="76" y="268" fill="#eceef2" font-size="14.5" font-weight="600" font-family="ui-monospace, monospace">DefaultLocale : ILocale</text>
  <text x="76" y="290" fill="#9aa0ab" font-size="12.5" font-family="ui-monospace, monospace">homeTitle() = 0 · signUpTitle() = 0</text>
  <text x="76" y="307" fill="#6b7180" font-size="11.5" font-family="ui-monospace, monospace">your translation keys</text>

  <!-- EnLocale -->
  <rect x="56" y="356" width="142" height="86" rx="12" fill="#1c1f27" stroke="#2b2f3a"/>
  <text x="74" y="382" fill="#eceef2" font-size="14" font-weight="600" font-family="ui-monospace, monospace">EnLocale</text>
  <text x="74" y="404" fill="#7c8bff" font-size="12.5" font-family="ui-monospace, monospace">code "en"</text>
  <text x="74" y="424" fill="#9aa0ab" font-size="12.5" font-family="ui-monospace, monospace">→ "Welcome"</text>

  <!-- FrLocale -->
  <rect x="214" y="356" width="142" height="86" rx="12" fill="#1c1f27" stroke="#2b2f3a"/>
  <text x="232" y="382" fill="#eceef2" font-size="14" font-weight="600" font-family="ui-monospace, monospace">FrLocale</text>
  <text x="232" y="404" fill="#7c8bff" font-size="12.5" font-family="ui-monospace, monospace">code "fr"</text>
  <text x="232" y="424" fill="#9aa0ab" font-size="12.5" font-family="ui-monospace, monospace">→ "Bienvenue"</text>

  <!-- inheritance arrows (hollow triangle points to parent) -->
  <line x1="206" y1="240" x2="206" y2="204" stroke="#3a3f4b" stroke-width="1.8"/>
  <polygon points="206,196 200,208 212,208" fill="#13151a" stroke="#5b6270" stroke-width="1.6"/>

  <line x1="127" y1="356" x2="150" y2="320" stroke="#3a3f4b" stroke-width="1.8"/>
  <polygon points="153,314 143,320 152,327" fill="#13151a" stroke="#5b6270" stroke-width="1.6"/>

  <line x1="285" y1="356" x2="262" y2="320" stroke="#3a3f4b" stroke-width="1.8"/>
  <polygon points="259,314 260,327 269,320" fill="#13151a" stroke="#5b6270" stroke-width="1.6"/>

  <!-- ===== right: I18n<T> singleton ===== -->
  <rect x="430" y="132" width="402" height="310" rx="16" fill="#1a1e26" stroke="#333a49"/>
  <text x="454" y="166" fill="#7c8bff" font-size="17" font-weight="700" font-family="ui-monospace, monospace">I18n&lt;DefaultLocale&gt;</text>
  <text x="700" y="166" fill="#6b7180" font-size="12" font-family="ui-monospace, monospace">«singleton»</text>

  <text x="454" y="200" fill="#9aa0ab" font-size="13" font-family="ui-monospace, monospace">getInstance()</text>

  <text x="454" y="230" fill="#eceef2" font-size="13" font-family="ui-monospace, monospace">setSupportedLocales&lt;EnLocale, FrLocale&gt;()</text>
  <text x="454" y="248" fill="#6b7180" font-size="11" font-family="ui-monospace, monospace">compile-time · concept-checked (DerivedFrom, IsTuple)</text>

  <!-- fallback chain -->
  <text x="454" y="284" fill="#eceef2" font-size="13" font-family="ui-monospace, monospace">setDefault() — fallback</text>
  <g font-family="ui-monospace, monospace" font-size="12.5">
    <rect x="454" y="298" width="118" height="30" rx="8" fill="#20242e" stroke="#333a49"/>
    <text x="513" y="318" fill="#9aa0ab" text-anchor="middle">system fr_FR</text>
    <text x="584" y="318" fill="#5b6270" text-anchor="middle">→</text>
    <rect x="596" y="298" width="60" height="30" rx="8" fill="#20242e" stroke="#333a49"/>
    <text x="626" y="318" fill="#9aa0ab" text-anchor="middle">en</text>
    <text x="668" y="318" fill="#5b6270" text-anchor="middle">→</text>
    <rect x="680" y="298" width="86" height="30" rx="8" fill="#20242e" stroke="#333a49"/>
    <text x="723" y="318" fill="#9aa0ab" text-anchor="middle">first</text>
  </g>

  <line x1="454" y1="352" x2="808" y2="352" stroke="#2b2f3a" stroke-width="1"/>

  <!-- runtime call -->
  <text x="454" y="384" fill="#4ec9a5" font-size="13.5" font-family="ui-monospace, monospace">getLocale()->homeTitle()</text>
  <rect x="680" y="370" width="128" height="26" rx="8" fill="#132420" stroke="#2c4a40"/>
  <text x="744" y="388" fill="#4ec9a5" font-size="13" font-family="ui-monospace, monospace" text-anchor="middle">"Bienvenue"</text>
  <text x="454" y="414" fill="#6b7180" font-size="11.5" font-family="ui-monospace, monospace">runtime switch · setLocale("fr")</text>

  <!-- link registered locales to the manager -->
  <path d="M 356 290 C 400 290, 400 232, 448 232" fill="none" stroke="#4b5160" stroke-width="1.8" stroke-dasharray="5 5"/>
  <polygon points="448,232 438,227 438,237" fill="#4b5160"/>
  <text x="368" y="258" fill="#6b7180" font-size="11" font-family="ui-monospace, monospace">register</text>
</svg>
