<svg xmlns="http://www.w3.org/2000/svg" width="820" height="512" viewBox="0 0 820 512">
  <rect width="820" height="512" rx="14" fill="#0b0d10"/>
  <rect width="820" height="60" rx="14" fill="#15181d"/>
  <rect y="46" width="820" height="14" fill="#15181d"/>
  <line x1="0" y1="60" x2="820" y2="60" stroke="#22262d" stroke-width="1"/>
  <circle cx="28" cy="30" r="7" fill="#ff5f56"/><circle cx="50" cy="30" r="7" fill="#ffbd2e"/><circle cx="72" cy="30" r="7" fill="#27c93f"/>
  <text x="410" y="36" font-size="16" text-anchor="middle" fill="#8b98a5" font-family="ui-monospace, monospace">ghp — fetch GitHub repos from an organization</text>
  <text x="40" y="96" font-size="21" font-family="ui-monospace, 'SF Mono', Menlo, monospace"><tspan fill="#4a9eff" xml:space="preserve">$ </tspan><tspan fill="#e6edf3" xml:space="preserve">ghp create</tspan><tspan fill="#8b98a5" xml:space="preserve"> -o PC-Toolbox -n my-repo</tspan></text><text x="40" y="138" font-size="21" font-family="ui-monospace, 'SF Mono', Menlo, monospace"><tspan fill="#5b6673" xml:space="preserve">  # create a repo under an org</tspan></text><text x="40" y="201" font-size="21" font-family="ui-monospace, 'SF Mono', Menlo, monospace"><tspan fill="#4a9eff" xml:space="preserve">$ </tspan><tspan fill="#e6edf3" xml:space="preserve">ghp list</tspan><tspan fill="#8b98a5" xml:space="preserve"> -o PC-Toolbox -g lang</tspan></text><text x="40" y="243" font-size="21" font-family="ui-monospace, 'SF Mono', Menlo, monospace"><tspan fill="#5b6673" xml:space="preserve">  # list &amp; group repos</tspan></text><text x="40" y="306" font-size="21" font-family="ui-monospace, 'SF Mono', Menlo, monospace"><tspan fill="#4a9eff" xml:space="preserve">$ </tspan><tspan fill="#e6edf3" xml:space="preserve">ghp edit</tspan><tspan fill="#8b98a5" xml:space="preserve"> -n my-repo -v on</tspan></text><text x="40" y="348" font-size="21" font-family="ui-monospace, 'SF Mono', Menlo, monospace"><tspan fill="#5b6673" xml:space="preserve">  # rename / template / visibility</tspan></text><text x="40" y="411" font-size="21" font-family="ui-monospace, 'SF Mono', Menlo, monospace"><tspan fill="#4a9eff" xml:space="preserve">$ </tspan><tspan fill="#e6edf3" xml:space="preserve">ghp delete</tspan><tspan fill="#8b98a5" xml:space="preserve"> -o PC-Toolbox -r my-repo</tspan></text>
</svg>