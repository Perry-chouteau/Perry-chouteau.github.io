<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="1800" height="1200" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif">
  <rect width="900" height="600" fill="#13151a"/>
  <text x="48" y="70" fill="#7c8bff" font-size="40" font-weight="700">Kubernetes Cluster</text>
  <text x="48" y="98" fill="#6b7180" font-size="14" font-family="ui-monospace, monospace">self-hosted · single VPS · build → push → pull, no managed service</text>

  <!-- CI/CD pipeline row -->
  <g font-family="ui-monospace, monospace" font-size="13">
    <rect x="48"  y="122" width="150" height="42" rx="10" fill="#1c1f27" stroke="#2b2f3a"/><text x="123" y="148" fill="#c7ccd6" text-anchor="middle">GitHub Actions</text>
    <text x="206" y="148" fill="#5b6270" text-anchor="middle">→</text>
    <rect x="220" y="122" width="130" height="42" rx="10" fill="#1c1f27" stroke="#2b2f3a"/><text x="285" y="148" fill="#c7ccd6" text-anchor="middle">Podman build</text>
    <text x="360" y="148" fill="#5b6270" text-anchor="middle">→</text>
    <rect x="374" y="122" width="170" height="42" rx="10" fill="#1c1f27" stroke="#2b2f3a"/><text x="459" y="148" fill="#c7ccd6" text-anchor="middle">self-hosted Registry</text>
    <text x="556" y="148" fill="#5b6270" text-anchor="middle">→</text>
    <rect x="570" y="122" width="160" height="42" rx="10" fill="#1c1f27" stroke="#2b2f3a"/><text x="650" y="148" fill="#c7ccd6" text-anchor="middle">rollout restart</text>
  </g>

  <!-- cluster boundary -->
  <rect x="48" y="192" width="804" height="372" rx="18" fill="#161922" stroke="#333a49"/>
  <text x="72" y="222" fill="#e0a458" font-size="13" font-family="ui-monospace, monospace">CLUSTER  ·  Cilium CNI</text>

  <!-- Ingress -->
  <rect x="72" y="240" width="756" height="96" rx="12" fill="#1c1f27" stroke="#2b2f3a"/>
  <text x="92" y="268" fill="#eceef2" font-size="15" font-weight="600" font-family="ui-monospace, monospace">Traefik — ingress</text>
  <text x="300" y="268" fill="#9aa0ab" font-size="12.5" font-family="ui-monospace, monospace">TLS via cert-manager (Let's Encrypt)</text>
  <g font-family="ui-monospace, monospace" font-size="12">
    <rect x="92"  y="286" width="120" height="30" rx="8" fill="#20242e" stroke="#333a49"/><text x="152" y="306" fill="#9aa0ab" text-anchor="middle">HTTPS redirect</text>
    <rect x="224" y="286" width="70"  height="30" rx="8" fill="#20242e" stroke="#333a49"/><text x="259" y="306" fill="#9aa0ab" text-anchor="middle">HSTS</text>
    <rect x="306" y="286" width="110" height="30" rx="8" fill="#20242e" stroke="#333a49"/><text x="361" y="306" fill="#9aa0ab" text-anchor="middle">basic-auth</text>
    <rect x="560" y="286" width="256" height="30" rx="8" fill="#20242e" stroke="#333a49"/><text x="688" y="306" fill="#9aa0ab" text-anchor="middle">Secrets · registry pull · basic-auth</text>
  </g>

  <!-- Workloads (Helm) -->
  <text x="72" y="368" fill="#7c8bff" font-size="13" font-family="ui-monospace, monospace">Workloads — Helm releases (pull image from Registry)</text>
  <g font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">
    <rect x="72"  y="382" width="176" height="48" rx="10" fill="#1c1f27" stroke="#2b2f3a"/><text x="160" y="411" fill="#eceef2">portfolio</text>
    <rect x="264" y="382" width="176" height="48" rx="10" fill="#1c1f27" stroke="#2b2f3a"/><text x="352" y="411" fill="#eceef2">gbg-showcase</text>
    <rect x="456" y="382" width="176" height="48" rx="10" fill="#1c1f27" stroke="#2b2f3a"/><text x="544" y="411" fill="#eceef2">vocal30-showcase</text>
    <rect x="648" y="382" width="180" height="48" rx="10" fill="#1c1f27" stroke="#2b2f3a"/><text x="738" y="411" fill="#eceef2">excalidraw</text>
  </g>

  <!-- Data -->
  <text x="72" y="466" fill="#7c8bff" font-size="13" font-family="ui-monospace, monospace">Stateful</text>
  <g font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">
    <rect x="72"  y="480" width="220" height="48" rx="10" fill="#161d1b" stroke="#2c3a35"/><text x="182" y="509" fill="#4ec9a5">PostgreSQL (CNPG)</text>
    <rect x="308" y="480" width="180" height="48" rx="10" fill="#161d1b" stroke="#2c3a35"/><text x="398" y="509" fill="#4ec9a5">MongoDB</text>
    <rect x="504" y="480" width="324" height="48" rx="10" fill="#20242e" stroke="#333a49"/><text x="666" y="509" fill="#9aa0ab">persistent volumes · on-node storage</text>
  </g>

  <text x="48" y="588" fill="#6b7180" font-size="12.5" font-family="ui-monospace, monospace">Registry lives inside the cluster — Kubernetes pulls the image it just built.</text>
</svg>
